<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yellow Design Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f5f7;
            padding: 20px;
        }

        .banner-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 900 / 500;
            background-color: #FAFF00;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
        }

        /* Left white section forming the dynamic triangle cutouts */
        .left-content-area {
            position: absolute;
            left: 0;
            top: 0;
            width: 62%;
            height: 100%;
            background-color: #ffffff;
            /* Creates the exact two-point triangle wedge shape into the yellow background */
            clip-path: polygon(0 0, 35% 0, 100% 46%, 35% 100%, 0 100%);
            padding: 5% 6%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
        }

        /* Logo badge styling */
        .logo-badge {
            width: 70px;
            height: 70px;
            background-color: #FAFF00;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 25px;
        }

        /* Main info cluster containing the copy */
        .info-cluster {
            margin-top: auto;
            margin-bottom: auto;
            max-width: 75%;
        }

        .info-cluster p {
            font-size: 1.25rem;
            font-weight: 600;
            color: #000000;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .contact-info {
            font-size: 1.1rem;
            color: #333333;
            line-height: 1.6;
        }

        .contact-label {
            font-weight: 400;
        }

        .phone-number {
            font-weight: 600;
            display: block;
        }

        /* Right yellow section text header alignment */
        .right-header-area {
            position: absolute;
            right: 0;
            top: 0;
            width: 65%;
            height: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            padding: 6% 7%;
            z-index: 1;
        }

        .right-header-area h1 {
            font-size: 3.2rem;
            font-weight: 700;
            color: #000000;
            letter-spacing: -0.5px;
        }

        /* Responsive scaling adjustments for smaller layouts */
        @media (max-width: 600px) {
            .right-header-area h1 {
                font-size: 1.8rem;
            }
            .logo-badge {
                width: 45px;
                height: 45px;
                font-size: 1.4rem;
            }
            .info-cluster p {
                font-size: 0.8rem;
                margin-bottom: 10px;
            }
            .contact-info {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <!-- White layout layer containing content and custom wedge logic -->
        <div class="left-content-area">
            <div class="logo-badge">Y</div>
            
            <div class="info-cluster">
                <p>We make affordable<br>posters menus etc...<br>for businesses</p>
                
                <div class="contact-info">
                    <span class="contact-label">Contact us at</span>
                    <span class="phone-number">+27829743626</span>
                </div>
            </div>
        </div>

        <!-- Background yellow canvas layer housing the main title text -->
        <div class="right-header-area">
            <h1>Yellow design</h1>
        </div>
    </div>

</body>
</html>

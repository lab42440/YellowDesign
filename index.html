<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yellow Design | Ultra-Affordable Graphic Design for Startups</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: #ffffff;
            color: #000000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Full landscape canvas wrapper matching your Canva mockup ratio */
        .yellow-design-hero {
            display: flex;
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
            border: 1px solid #e5e7eb;
        }

        /* Left Side: White background area with branding and contact details */
        .hero-left-content {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 40px 40px 60px;
            z-index: 2;
            background-color: #ffffff;
        }

        /* Yellow 'Y' Brand Circle Badge */
        .brand-logo-container {
            margin-bottom: 25px;
        }

        .brand-circle-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            background-color: #f7ff00; /* Vibrant Canva Yellow Match */
            border-radius: 50%;
            font-size: 52px;
            font-weight: 700;
            color: #000000;
        }

        /* Text copy formatting exactly matching your template font sizes */
        .hero-text-block {
            color: #000000;
        }

        .hero-tagline {
            font-size: 1.25rem;
            line-height: 1.4;
            font-weight: 700;
            margin: 0 0 25px 0;
            color: #000000;
        }

        .hero-contact {
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.4;
            margin: 0 0 25px 0;
        }

        .contact-link {
            color: #000000;
            text-decoration: none;
            font-weight: 500;
        }

        /* Integrated WhatsApp Call-to-Action Link */
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #25d366; 
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
            align-self: flex-start;
            border: none;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.15);
        }

        .whatsapp-btn:hover {
            transform: translateY(-1px);
            background: #1ebd58;
        }

        /* Right Side: Recreates the sharp landscape arrow slice into the white field */
        .hero-right-banner {
            flex: 1.3;
            background-color: #f7ff00; 
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 55px 40px 40px 90px;
            /* Precise geometric layout definition for the inward pointing arrow shape */
            clip-path: polygon(30% 0%, 100% 0%, 100% 100%, 30% 100%, 0% 50%);
            margin-left: -120px; /* Pulls shape leftward to overlap gracefully over layout */
        }

        /* Big 'Yellow design' Header text */
        .hero-title {
            font-size: 3.2rem;
            font-weight: 700;
            color: #000000;
            margin: 0;
            line-height: 1.1;
            letter-spacing: -0.5px;
        }

        /* Fluid transformation breakpoint logic for mobile viewports */
        @media (max-width: 768px) {
            .yellow-design-hero {
                flex-direction: column-reverse;
                max-width: 100%;
                min-height: auto;
            }
            
            .hero-right-banner {
                clip-path: none;
                padding: 50px 30px;
                flex: none;
                margin-left: 0;
                justify-content: center;
                text-align: center;
            }

            .hero-title {
                font-size: 2.5rem;
            }
            
            .hero-left-content {
                padding: 40px 30px;
                flex: none;
                align-items: center;
                text-align: center;
            }

            .whatsapp-btn {
                align-self: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <main class="yellow-design-hero">
        
        <section class="hero-left-content">
            <div class="brand-logo-container">
                <div class="brand-circle-logo">Y</div>
            </div>
            
            <div class="hero-text-block">
                <p class="hero-tagline">
                    We make affordable<br>
                    posters menus ect...<br>
                    for businesses
                </p>
                
                <p class="hero-contact">
                    Contact us at<br>
                    <a href="tel:+27829743626" class="contact-link">+27829743626</a>
                </p>
                
                <a href="https://wa.me" target="_blank" class="whatsapp-btn">
                    💬 Chat on WhatsApp
                </a>
            </div>
        </section>

        <!-- Right Side Banner Element (Visual Layout Split Corner Point) -->
        <section class="hero-right-banner">
            <h1 class="hero-title">Yellow design</h1>
        </section>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yellow Design</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 800px;
            height: 450px;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Left Content Area */
        .content-section {
            width: 45%;
            height: 100%;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
            background-color: #ffffff;
        }

        .logo-circle {
            width: 90px;
            height: 90px;
            background-color: #FAFF00;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            font-weight: 800;
            color: #000000;
        }

        .text-info {
            margin-top: -10px;
        }

        .text-info p {
            font-size: 18px;
            line-height: 1.4;
            font-weight: 700;
            color: #000000;
            margin-bottom: 30px;
        }

        .contact-info {
            font-size: 16px;
            color: #333333;
            line-height: 1.5;
        }

        .contact-info .label {
            font-weight: 400;
        }

        .contact-info .phone {
            font-weight: 600;
        }

        /* Right Yellow Geometric Area */
        .visual-section {
            width: 55%;
            height: 100%;
            background-color: #FAFF00;
            position: relative;
            z-index: 1;
        }

        /* Sharp triangle wedge cutting into the left side */
        .visual-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 225px 0 225px 120px;
            border-color: transparent transparent transparent #ffffff;
        }

        .main-title {
            position: absolute;
            top: 50px;
            right: 40px;
            font-size: 46px;
            font-weight: 800;
            color: #000000;
            text-align: right;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Left Side -->
        <div class="content-section">
            <div class="logo-circle">Y</div>
            
            <div class="text-info">
                <p>We make affordable<br>posters menus ect...<br>for businesses</p>
                
                <div class="contact-info">
                    <span class="label">Contact us at</span><br>
                    <span class="phone">+27829743626</span>
                </div>
            </div>
        </div>

        <!-- Right Side -->
        <div class="visual-section">
            <h1 class="main-title">Yellow design</h1>
        </div>
    </div>

</body>
</html>
